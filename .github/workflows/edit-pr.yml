name: Edit files and create PR
run-name: 'edit-pr / ${{ inputs.api }} / PR ${{ inputs.expect_pr }} / CI ${{ inputs.ci }}'
on:
  workflow_dispatch:
    inputs:
      api:
        type: choice
        options: [contents, graphql]
      expect_pr:
        type: choice
        options: [allow, deny]
      ci:
        type: choice
        options: [event, dispatch]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: edit-pr-lab
  cancel-in-progress: false
jobs:
  edit-and-create:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Edit, validate, commit through API, and create PR
        env:
          GH_TOKEN: ${{ github.token }}
          LAB_API: ${{ inputs.api }}
          LAB_PR_EXPECT: ${{ inputs.expect_pr }}
          LAB_CI_MODE: ${{ inputs.ci }}
        run: python3 scripts/edit-pr.py
