name: Minimal GraphQL signed commit
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  example:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: sample/graphql-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Create a remote work branch at the checked-out HEAD
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/heads/$BRANCH" -f sha="$(git rev-parse HEAD)"
      - name: Edit files locally
        run: python3 scripts/edit-graphql-example.py
      - name: Stage the intended changes
        run: git add -A -- examples/graphql/files
      - name: Replace git commit and git push
        id: commit
        run: python3 scripts/commit-with-graphql.py "$BRANCH" "Update dummy files through GraphQL"
      - name: Create PR
        id: pr
        run: |
          PR_URL=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "Dummy GraphQL update $GITHUB_RUN_ID" --body "Dummy-only example: edit, signed commit, PR, then CI.")
          printf 'number=%s\n' "${PR_URL##*/}" >> "$GITHUB_OUTPUT"
          printf 'PR: %s\n' "$PR_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Start CI on the PR head
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.commit_sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          gh workflow run graphql-example-ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH" \
            -f expected_sha="$COMMIT_SHA" -f pr_number="$PR_NUMBER"
